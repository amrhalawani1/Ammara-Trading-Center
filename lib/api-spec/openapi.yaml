openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ATC catalogue and content workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Published catalogue content
  - name: inquiries
    description: Public inquiries from the contact page
  - name: account
    description: Optional trade account profile, shortlists, and inquiry history
  - name: content
    description: Staff content workspace
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog:
    get:
      operationId: getPublicCatalog
      tags: [catalogue]
      summary: List published catalogue content
      responses:
        "200":
          description: Published brands, products, and product categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
  /catalog/brands/{slug}:
    get:
      operationId: getPublicBrand
      tags: [catalogue]
      summary: Get a published brand and its products
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDetail"
        "404":
          description: Brand not found
  /catalog/products/{slug}:
    get:
      operationId: getPublicProduct
      tags: [catalogue]
      summary: Get a published product
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /inquiries:
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a general, shortlist or newsletter inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResult"
        "400":
          description: Invalid inquiry
  /account/profile:
    get:
      operationId: getAccountProfile
      tags: [account]
      security: [{ clerkSession: [] }]
      summary: The signed-in trade visitor's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeProfile"
        "401":
          description: Sign-in required
    put:
      operationId: putAccountProfile
      tags: [account]
      security: [{ clerkSession: [] }]
      summary: Create or update the trade profile and claim guest inquiries by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeProfile"
        "400":
          description: Invalid profile
        "401":
          description: Sign-in required
  /account/shortlists:
    get:
      operationId: getAccountShortlists
      tags: [account]
      security: [{ clerkSession: [] }]
      summary: The account's saved shortlists
      responses:
        "200":
          description: Shortlist state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShortlistState"
        "401":
          description: Sign-in required
    put:
      operationId: putAccountShortlists
      tags: [account]
      security: [{ clerkSession: [] }]
      summary: Replace or merge device shortlists into the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAccountShortlistsInput"
      responses:
        "200":
          description: Canonical shortlist state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShortlistState"
        "400":
          description: Invalid shortlists
        "401":
          description: Sign-in required
  /account/inquiries:
    get:
      operationId: getAccountInquiries
      tags: [account]
      security: [{ clerkSession: [] }]
      summary: Trade inquiries submitted by or claimed for this account
      responses:
        "200":
          description: Inquiry history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountInquiry"
        "401":
          description: Sign-in required
  /content/inquiries:
    get:
      operationId: listContentInquiries
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: List inquiries for the staff inbox
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InquiryStatus"
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [general, shortlist, newsletter]
      responses:
        "200":
          description: Inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentInquiry"
        "401":
          description: Staff sign-in required
        "403":
          description: Not a staff account
  /content/inquiries/{id}:
    patch:
      operationId: patchContentInquiry
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Update an inquiry's status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchInquiryStatusInput"
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentInquiry"
        "400":
          description: Invalid status
        "401":
          description: Staff sign-in required
        "403":
          description: Not a staff account
        "404":
          description: Inquiry not found
  /content/brands:
    get:
      operationId: listContentBrands
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: List all brands for the content workspace
      responses:
        "200":
          description: All brands, including drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createContentBrand
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandInput"
      responses:
        "201":
          description: Created brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid content
  /content/brands/{id}:
    put:
      operationId: updateContentBrand
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Update a brand
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandUpdate"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid content
        "404":
          description: Brand not found
    delete:
      operationId: deleteContentBrand
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Delete a brand
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Brand deleted
        "400":
          description: Brand has products
        "404":
          description: Brand not found
  /content/products:
    get:
      operationId: listContentProducts
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: List all products for the content workspace
      responses:
        "200":
          description: All products, including drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createContentProduct
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid content
  /content/products/{id}:
    put:
      operationId: updateContentProduct
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid content
        "404":
          description: Product not found
    delete:
      operationId: deleteContentProduct
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /content/import:
    post:
      operationId: importCatalogContent
      tags: [content]
      security: [{ clerkSession: [] }]
      summary: Upsert future MySQL catalogue records
      description: Import records by legacy ID while preserving existing slugs and public URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid import
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: number
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ContentStatus:
      type: string
      enum: [draft, published, comingSoon, retired]
    Spec:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        group:
          type: [string, "null"]
      required: [label, value]
    Brand:
      type: object
      properties:
        id:
          type: number
        legacyId:
          type: [string, "null"]
        name:
          type: string
        slug:
          type: string
        country:
          type: [string, "null"]
        origin:
          type: string
        category:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        description:
          type: string
        coverImage:
          type: [string, "null"]
        websiteUrl:
          type: [string, "null"]
        isFeatured:
          type: boolean
        status:
          $ref: "#/components/schemas/ContentStatus"
      required: [id, name, slug, origin, description, isFeatured, status]
    BrandDetail:
      allOf:
        - $ref: "#/components/schemas/Brand"
        - type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/Product"
          required: [products]
    Product:
      type: object
      properties:
        id:
          type: number
        legacyId:
          type: [string, "null"]
        title:
          type: string
        name:
          type: string
        slug:
          type: string
        brandId:
          type: number
        brandSlug:
          type: string
        brandName:
          type: string
        sku:
          type: [string, "null"]
        category:
          type: string
        family:
          type: [string, "null"]
        description:
          type: string
        image:
          type: [string, "null"]
        images:
          type: array
          items:
            type: string
        material:
          type: [string, "null"]
        finish:
          type: [string, "null"]
        dimensions:
          type: [string, "null"]
        specs:
          type: array
          items:
            $ref: "#/components/schemas/Spec"
        finishes:
          type: array
          items:
            type: string
        installationNotes:
          type: [string, "null"]
        editorial:
          anyOf:
            - $ref: "#/components/schemas/ProductEditorial"
            - type: "null"
        details:
          anyOf:
            - $ref: "#/components/schemas/ProductDetails"
            - type: "null"
        isFeatured:
          type: boolean
        status:
          $ref: "#/components/schemas/ContentStatus"
      required: [id, title, name, slug, brandId, brandSlug, brandName, category, description, images, specs, finishes, isFeatured, status]
    ProductDetails:
      type: object
      properties:
        sourceUrl:
          type: [string, "null"]
        collection:
          type: [string, "null"]
        brandCategoryPath:
          type: array
          items:
            type: string
        badges:
          type: array
          items:
            type: string
        summary:
          type: [string, "null"]
        features:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              body:
                type: [string, "null"]
              image:
                type: [string, "null"]
            required: [title]
        variants:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              label:
                type: string
              kind:
                type: string
                enum: [finish, size, model, colour]
              articleNumber:
                type: [string, "null"]
              attributes:
                type: object
                additionalProperties:
                  type: string
              image:
                type: [string, "null"]
            required: [code, label, kind]
        applications:
          type: array
          items:
            type: string
        downloads:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              fileType:
                type: string
            required: [label, fileType]
        media:
          type: array
          items:
            type: object
            properties:
              src:
                type: string
              role:
                type: string
                enum: [cutout, finish, detail, ambient, technical]
              variantCode:
                type: [string, "null"]
              alt:
                type: [string, "null"]
            required: [src, role]
        related:
          type: array
          items:
            type: string
        videos:
          type: number
    ProductEditorial:
      type: object
      properties:
        statement:
          type: string
        awards:
          type: array
          items:
            type: string
        chapters:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              body:
                type: string
              image:
                type: [string, "null"]
            required: [title, body]
        designer:
          type: object
          properties:
            name:
              type: string
            bio:
              type: string
            url:
              type: [string, "null"]
          required: [name, bio]
        gallery:
          type: array
          items:
            type: string
    CatalogResponse:
      type: object
      properties:
        brands:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          items:
            type: string
      required: [brands, products, categories]
    BrandInput:
      type: object
      properties:
        legacyId:
          type: [string, "null"]
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        country:
          type: [string, "null"]
        category:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        description:
          type: string
        coverImage:
          type: [string, "null"]
        websiteUrl:
          type: [string, "null"]
        isFeatured:
          type: boolean
        status:
          $ref: "#/components/schemas/ContentStatus"
      required: [name, slug, description, isFeatured, status]
    BrandUpdate:
      allOf:
        - $ref: "#/components/schemas/BrandInput"
      required: []
    ProductInput:
      type: object
      properties:
        legacyId:
          type: [string, "null"]
        title:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        brandId:
          type: number
        brandSlug:
          type: string
        sku:
          type: [string, "null"]
        category:
          type: string
        family:
          type: [string, "null"]
        description:
          type: string
        image:
          type: [string, "null"]
        images:
          type: array
          items:
            type: string
        material:
          type: [string, "null"]
        finish:
          type: [string, "null"]
        dimensions:
          type: [string, "null"]
        specs:
          type: array
          items:
            $ref: "#/components/schemas/Spec"
        finishes:
          type: array
          items:
            type: string
        installationNotes:
          type: [string, "null"]
        editorial:
          anyOf:
            - $ref: "#/components/schemas/ProductEditorial"
            - type: "null"
        details:
          anyOf:
            - $ref: "#/components/schemas/ProductDetails"
            - type: "null"
        isFeatured:
          type: boolean
        status:
          $ref: "#/components/schemas/ContentStatus"
      required: [title, slug, brandSlug, category, description, image, images, specs, finishes, isFeatured, status]
    ProductUpdate:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
      required: []
    ImportBrand:
      allOf:
        - $ref: "#/components/schemas/BrandInput"
        - type: object
          properties:
            legacyId:
              type: string
              minLength: 1
          required: [legacyId]
    ImportProduct:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          properties:
            legacyId:
              type: string
              minLength: 1
          required: [legacyId]
    ImportInput:
      type: object
      properties:
        brands:
          type: array
          items:
            $ref: "#/components/schemas/ImportBrand"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ImportProduct"
      required: [brands, products]
    ImportResult:
      type: object
      properties:
        brandsUpserted:
          type: number
        productsUpserted:
          type: number
        preservedSlugs:
          type: number
      required: [brandsUpserted, productsUpserted, preservedSlugs]
    InquiryInput:
      type: object
      properties:
        kind:
          type: string
          enum: [general, shortlist, newsletter]
        name:
          type: string
          minLength: 2
        email:
          type: string
          minLength: 3
        phone:
          type: [string, "null"]
        company:
          type: [string, "null"]
        projectType:
          type: [string, "null"]
        timeline:
          type: [string, "null"]
          maxLength: 80
        listName:
          type: [string, "null"]
          maxLength: 80
        message:
          type: string
          minLength: 10
          maxLength: 20000
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ShortlistItemInput"
      required: [kind, name, email, message]
    ShortlistItemInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 200
        brandName:
          type: string
          minLength: 1
          maxLength: 120
        reference:
          type: [string, "null"]
          maxLength: 120
        variant:
          type: [string, "null"]
          maxLength: 200
        quantity:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 9999
      required: [slug, name, brandName, quantity]
    InquiryResult:
      type: object
      properties:
        accepted:
          type: boolean
        reference:
          type: string
      required: [accepted, reference]
    InquiryStatus:
      type: string
      enum: [submitted, in_progress, responded]
    TradeRole:
      type: string
      enum: [specifier, procurement, fabricator, other]
    SavedItemKind:
      type: string
      enum: [product, brand]
    TradeProfile:
      type: object
      properties:
        clerkUserId:
          type: string
        email:
          type: string
        name:
          type: [string, "null"]
        company:
          type: [string, "null"]
        role:
          oneOf:
            - $ref: "#/components/schemas/TradeRole"
            - type: "null"
      required: [clerkUserId, email]
    TradeProfileInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
        name:
          type: [string, "null"]
          maxLength: 120
        company:
          type: [string, "null"]
          maxLength: 120
        role:
          oneOf:
            - $ref: "#/components/schemas/TradeRole"
            - type: "null"
      required: [email]
    AccountShortlistItem:
      type: object
      properties:
        key:
          type: string
        slug:
          type: string
        name:
          type: string
        brandName:
          type: string
        reference:
          type: string
        variant:
          type: [string, "null"]
        image:
          type: [string, "null"]
        quantity:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 9999
        addedAt:
          type: string
        kind:
          $ref: "#/components/schemas/SavedItemKind"
      required: [key, slug, name, brandName, reference, quantity, addedAt]
    AccountShortlist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountShortlistItem"
      required: [id, name, createdAt, items]
    AccountShortlistState:
      type: object
      properties:
        version:
          type: number
          enum: [1]
        lists:
          type: array
          items:
            $ref: "#/components/schemas/AccountShortlist"
        activeListId:
          type: string
      required: [version, lists, activeListId]
    PutAccountShortlistsInput:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/AccountShortlistState"
        merge:
          type: boolean
      required: [state]
    AccountInquiry:
      type: object
      properties:
        id:
          type: number
        kind:
          type: string
          enum: [general, shortlist, newsletter]
        reference:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/InquiryStatus"
        listName:
          type: [string, "null"]
        message:
          type: string
        createdAt:
          type: string
        statusUpdatedAt:
          type: [string, "null"]
      required: [id, kind, status, message, createdAt]
    ContentInquiry:
      type: object
      properties:
        id:
          type: number
        kind:
          type: string
          enum: [general, shortlist, newsletter]
        name:
          type: string
        email:
          type: string
        phone:
          type: [string, "null"]
        company:
          type: [string, "null"]
        reference:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/InquiryStatus"
        listName:
          type: [string, "null"]
        timeline:
          type: [string, "null"]
        message:
          type: string
        clerkUserId:
          type: [string, "null"]
        createdAt:
          type: string
        statusUpdatedAt:
          type: [string, "null"]
      required: [id, kind, name, email, status, message, createdAt]
    PatchInquiryStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/InquiryStatus"
      required: [status]